<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Project</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="loginContainer" class="container mt-5" style="max-width: 420px;">
  <div class="card">
    <div class="card-body">
      <h4 class="mb-3 text-center">Login</h4>

      <input
        id="loginName"
        class="form-control mb-2"
        placeholder="Enter your name"
      />

      <select id="loginRole" class="form-select mb-3">
        <option value="">Select role</option>
        <option value="ADMIN">Admin</option>
        <option value="EMPLOYEE">Employee</option>
      </select>

      <button id="loginBtn" class="btn btn-primary w-100">
        Login
      </button>
    </div>
  </div>
</div>

<div class="container mt-4" id="appContainer">
  <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
  Logout
</button>

  <h2 class="mb-4">Feedback Kiosk System</h2>

  <!-- User Form -->
  <div class="card mb-4" id="userForm">
    <div class="card-body">
      <h5>Add User</h5>

      <div class="row g-2">
        <div class="col-md-3">
          <input id="nameInput" class="form-control" placeholder="Name" />
        </div>
        <div class="col-md-3">
          <input id="emailInput" class="form-control" placeholder="Email" />
        </div>
        <div class="col-md-2">
          <select id="roleSelect" class="form-select">
            <option value="ADMIN">ADMIN</option>
            <option value="USER">USER</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="statusSelect" class="form-select">
            <option value="PENDING">PENDING</option>
            <option value="APPROVED">APPROVED</option>
          </select>
        </div>
        <div class="col-md-2">
          <button id="addUserBtn" class="btn btn-primary w-100">
            Add User
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- User List -->
  <div id="userList" class="row g-3"></div>
</div>

<script type="module" src="dist/app.js"></script>
</body>
</html>
